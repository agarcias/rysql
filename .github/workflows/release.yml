name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to use for the manually triggered release (e.g. v0.6.0)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux-deb:
    name: Linux .deb (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deb
        run: cargo install --locked cargo-deb
      - name: Build release binary
        run: cargo build --release --locked --bin rysql
      - name: Build .deb
        run: cargo deb -p rysql-ui --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: rysql-linux-x86_64-deb
          path: target/debian/*.deb
          if-no-files-found: error

  linux-appimage:
    name: Linux AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            libdbus-1-dev pkg-config fuse libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build AppImage
        run: bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rysql-linux-x86_64-appimage
          path: target/appimage/RySQL-*-x86_64.AppImage
          if-no-files-found: error

  windows-exe:
    name: Windows .exe (cross from Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: xwin-release
      - name: Install cross-build tooling
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld
          cargo install --locked cargo-xwin
      - name: Build Windows binary
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p rysql-ui
      - name: Stage artifact
        run: |
          mkdir -p out
          cp target/x86_64-pc-windows-msvc/release/rysql.exe "out/rysql-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: rysql-windows-x86_64-exe
          path: out/rysql-windows-x86_64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux-deb, linux-appimage, windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.tag.outputs.name }}"
          gh release view "$TAG" --json id >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes-file CHANGELOG.md
          shopt -s globstar
          for f in artifacts/**/*; do
            [ -f "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber
          done
