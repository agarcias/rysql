[package]
name = "rysql-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RySQL desktop application (egui/eframe)."
default-run = "rysql"

[[bin]]
name = "rysql"
path = "src/main.rs"

[dependencies]
rysql-core = { workspace = true }
rysql-db = { workspace = true }
rysql-sql = { workspace = true }

eframe = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
egui_extras = { workspace = true }
rfd = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
anyhow = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = { workspace = true }

[package.metadata.deb]
maintainer = "RySQL contributors <noreply@example.com>"
copyright = "2026 RySQL contributors"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = """\
RySQL is a desktop SQL client for MySQL and MariaDB. Features a tabbed
SQL editor with syntax highlighting and autocompletion, a schema
browser, a virtualized results grid with edit-in-place by primary key,
persistent query history and per-statement cancellation."""
depends = "$auto, libxkbcommon0, libgl1, libwayland-client0"
section = "database"
priority = "optional"
assets = [
    ["target/release/rysql", "usr/bin/", "755"],
    ["../../packaging/linux/rysql.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/rysql.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/io.rysql.RySQL.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/rysql/", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/rysql/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rysql", dest = "/usr/bin/rysql", mode = "755" },
    { source = "packaging/linux/rysql.desktop", dest = "/usr/share/applications/rysql.desktop", mode = "644" },
    { source = "packaging/linux/rysql.svg", dest = "/usr/share/icons/hicolor/scalable/apps/rysql.svg", mode = "644" },
    { source = "packaging/linux/io.rysql.RySQL.metainfo.xml", dest = "/usr/share/metainfo/io.rysql.RySQL.metainfo.xml", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/rysql/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/rysql/LICENSE-APACHE", mode = "644" },
]
auto-req = "no"
[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
mesa-libGL = "*"
libwayland-client = "*"
